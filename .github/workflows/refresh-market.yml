name: Refresh fund NAV and HK history
on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest published NAV and history
        run: python3 update_data.py
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/market.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/market.json
          git commit -m 'Refresh market snapshot'
          git push
